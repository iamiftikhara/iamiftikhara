# Builds metrics.svg for the profile README, counting private repositories too.
# Needs a repository secret METRICS_TOKEN: a classic personal access token with
# the "repo" and "read:org" scopes (Settings -> Secrets and variables -> Actions).
name: Metrics

on:
  schedule:
    - cron: "0 22 * * *"   # daily, 3 AM Pakistan time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: iamiftikhara
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Karachi
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, shell, powershell, batchfile
          extras_css: ".calendar rect.day[fill='#ebedf0']{fill:#161b22}.calendar rect.day[fill='#9be9a8']{fill:#0e4429}.calendar rect.day[fill='#40c463']{fill:#006d32}.calendar rect.day[fill='#30a14e']{fill:#26a641}.calendar rect.day[fill='#216e39']{fill:#39d353}"
